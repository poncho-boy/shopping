<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Rust Linen Shirt Dress | Example Shop</title>
    <meta property="og:title" content="Rust Linen Shirt Dress" />
    <meta
      property="og:description"
      content="A relaxed linen shirt dress in a warm rust shade."
    />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Product",
        "name": "Linen Shirt Dress",
        "description": "Lightweight woven dress with self tie belt.",
        "color": "Rust",
        "offers": {
          "@type": "Offer",
          "availability": "https://schema.org/InStock"
        }
      }
    </script>
  </head>
  <body>
    <main>
      <h1>Rust Linen Shirt Dress</h1>
      <p>Color: <span class="selected-color">Rust</span></p>
      <button type="submit" name="add">Add to cart</button>
      <img src="dress-rust.jpg" alt="Rust linen dress front view" />
    </main>
  </body>
</html>
